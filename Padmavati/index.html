<style>
/* ============================================ CSS STARTS ============================================ */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Open+Sans:wght@400;600&display=swap');
:root {
    --primary-green: #00C853;
    --dark-green: #006421;
    --light-green: #e8f5e9;
    --tech-blue: #2962ff;
    --dark-blue: #0d47a1;

    --light-gray: #f8f9fa;

}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: 'Open Sans', sans-serif; color: var(--dark); background: var(--white); line-height: 1.7; overflow-x: hidden; }

a { text-decoration: none; color: inherit; }
ul { list-style: none; }
img { max-width: 100%; }

header { position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; background: rgba(255,255,255,0.98); backdrop-filter: blur(20px); box-shadow: 0 2px 30px rgba(0,0,0,0.08); }
.navbar { display: flex; justify-content: space-between; align-items: center; padding: 0 8%; height: 90px; transition: var(--transition); }
.logo { display: flex; align-items: center; font-size: 22px; font-weight: 800; color: var(--dark); letter-spacing: -0.5px; }

.nav-link:hover::after, .nav-link.active::after { width: 100%; }
.nav-link:hover { color: var(--primary-green); }
.btn-contact { background: linear-gradient(135deg, var(--primary-green), var(--dark-green)); color: var(--white); padding: 12px 28px; border-radius: 50px; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer; transition: var(--transition); border: none; }
.btn-contact:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,200,83,0.4); }
.mobile-toggle { display: none; font-size: 24px; cursor: pointer; }
@media(max-width: 768px) {

    .nav-menu.active { display: flex; }
    .mobile-toggle { display: block; }
    .hero-container { grid-template-columns: 1fr; text-align: center; }
    .hero-btns { justify-content: center; flex-wrap: wrap; }
    .hero-visual { display: none; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .footer-grid { grid-template-columns: 1fr; text-align: center; }
    .social-links { justify-content: center; }
}
/* PAGE SHOW/HIDE */
.page { display: none; animation: fadeIn 0.5s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
/* HERO */
.hero { min-height: 100vh; display: flex; align-items: center; position: relative; background: linear-gradient(135deg, #f8f9fa 0%, #e8f5e9 50%, #f8f9fa 100%); overflow: hidden; padding-top: 90px; }
.hero::before { content: ''; position: absolute; top: -20%; right: -5%; width: 600px; height: 600px; background: radial-gradient(circle, rgba(0,200,83,0.15) 0%, transparent 70%); border-radius: 50%; animation: pulse 6s ease-in-out infinite; }
.hero::after { content: ''; position: absolute; bottom: -15%; left: -5%; width: 400px; height: 400px; background: radial-gradient(circle, rgba(41,98,255,0.12) 0%, transparent 70%); border-radius: 50%; animation: pulse 8s ease-in-out infinite reverse; }
.hero-container { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: center; width: 90%; max-width: 1300px; margin: 0 auto; padding: 50px 0; }

.hero-title { font-size: 3.5rem; margin-bottom: 25px; animation: slideLeft 0.8s ease 0.2s forwards; opacity: 0; }

.float-card { position: absolute; background: var(--white); padding: 25px 30px; border-radius: 20px; box-shadow: var(--shadow); animation: float 4s ease-in-out infinite; display: flex; align-items: center; gap: 18px; }

.fc-text h4 { font-size: 15px; margin-bottom: 5px; }

.cta p { color: rgba(255,255,255,0.9); font-size: 17px; margin-bottom: 30px; position: relative; z-index: 2; }

.cta .btn:hover { background: var(--dark); color: var(--white); }
